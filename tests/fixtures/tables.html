<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tables - SaveBoth Fixture</title>
</head>
<body>
  <article>
    <h1>HTTP Status Codes</h1>
    <p>Common status codes are listed below.</p>
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Meaning</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>200</td>
          <td>OK</td>
          <td>The request succeeded</td>
        </tr>
        <tr>
          <td>404</td>
          <td>Not Found</td>
          <td>The resource does not exist</td>
        </tr>
        <tr>
          <td>500</td>
          <td>Internal Server Error</td>
          <td>The server failed unexpectedly</td>
        </tr>
      </tbody>
    </table>
  </article>
</body>
</html>
