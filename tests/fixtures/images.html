<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Images - SaveBoth Fixture</title>
</head>
<body>
  <article>
    <h1>Photo Gallery Notes</h1>
    <p>Images should be preserved as Markdown image links with alt text.</p>
    <img src="/images/mountain.jpg" alt="A mountain at sunrise" />
    <p>Relative image paths must be resolved against the page URL.</p>
    <img src="diagram.png" alt="Architecture diagram" />
    <p>Images without alt text should still keep their source URL.</p>
    <img src="https://cdn.example.com/photo.webp" alt="" />
  </article>
</body>
</html>
