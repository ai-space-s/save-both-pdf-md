<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nested Layout Table - SaveBoth Fixture</title>
</head>
<body>
  <!-- Mailchimp 스타일 이메일 뉴스레터: 레이아웃이 전부 중첩 테이블 -->
  <table width="100%" cellpadding="0" cellspacing="0">
    <tbody>
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0">
            <tbody>
              <tr>
                <td>
                  <table width="100%">
                    <tbody>
                      <tr>
                        <td>
                          <h1>Newsletter Issue 42</h1>
                          <p>UniquePhraseAlpha appears exactly once in the source document.</p>
                          <p>
                            The robot industry is moving toward
                            <a href="/articles/dexterity">dexterity research</a> at a rapid pace.
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td>
                          <img src="https://cdn.example.com/robot-hand.jpg" alt="Robot hand prototype" />
                          <p>UniquePhraseBeta closes the newsletter body.</p>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
