<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SaveBoth</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>SaveBoth</h1>
  </header>

  <section class="page-info">
    <div class="label">Current Page</div>
    <div id="pageTitle" class="page-title">Loading...</div>
    <div id="pageUrl" class="page-url"></div>
  </section>

  <section class="actions">
    <button id="saveBothBtn" class="btn btn-primary">Save PDF + Markdown</button>
    <button id="savePdfBtn" class="btn">Save PDF Only</button>
    <button id="saveMdBtn" class="btn">Save Markdown Only</button>
  </section>

  <section id="status" class="status" hidden></section>

  <footer class="app-footer">Processed locally. No server upload.</footer>

  <script src="../lib/errorUtils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
