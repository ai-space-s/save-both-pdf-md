<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SaveBoth</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <h1>SaveBoth</h1>
  </header>

  <section class="page-info">
    <div class="label">Current Page</div>
    <div id="pageTitle" class="page-title">Loading...</div>
    <div id="pageUrl" class="page-url"></div>
  </section>

  <section class="actions">
    <button id="saveBothBtn" class="btn btn-primary">Save PDF + Markdown</button>
    <button id="savePdfBtn" class="btn">Save PDF Only</button>
    <button id="saveMdBtn" class="btn">Save Markdown Only</button>
  </section>

  <section id="status" class="status" hidden></section>

  <details class="settings">
    <summary>Save location settings</summary>
    <div class="settings-body">
      <div class="field-label">Save folder</div>
      <div id="folderDisplay" class="folder-display">Default (Downloads folder)</div>

      <div class="folder-actions">
        <button id="chooseFolderBtn" class="btn btn-small" type="button">Choose folder…</button>
        <button id="resetFolderBtn" class="btn btn-small btn-secondary" type="button" hidden>
          Reset to default
        </button>
      </div>

      <p class="settings-hint settings-warning" id="folderPermissionNote" hidden>
        Access to this folder needs to be reconnected.
        <button id="reconnectFolderBtn" class="link-btn" type="button">Reconnect</button>
      </p>

      <label class="checkbox-row">
        <input id="askEachTimeCheckbox" type="checkbox" />
        <span>Ask where to save each time instead</span>
      </label>

      <p class="settings-hint" id="settingsHint">Files are saved to your Downloads folder.</p>
    </div>
  </details>

  <footer class="app-footer">Processed locally. No server upload.</footer>

  <script src="../lib/errorUtils.js"></script>
  <script src="../lib/settingsUtils.js"></script>
  <script src="../lib/fsHandleStore.js"></script>
  <script src="popup.js"></script>
</body>
</html>
